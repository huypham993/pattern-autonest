<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoNesting</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="tabs">
  <button id="modeLabels" class="tab on">Labels</button>
  <button id="modeGroup" class="tab">Group</button>
  <button id="modeNest" class="tab">Nesting</button>
</nav>
<nav class="tabs sub" id="nestTabs" hidden>
  <button id="tabSettings" class="tab on">Settings</button>
  <button id="tabResult" class="tab" disabled>Result</button>
</nav>

<main>
<section id="pageSettings" class="page" hidden>
  <div class="settings">
    <div class="row"><label for="sheetW">Fabric width (mm)</label><input id="sheetW" type="number" min="1" step="1" placeholder="artboard"></div>
    <div class="row"><label for="sheetL">Fabric length (mm)</label><input id="sheetL" type="number" min="1" step="1" placeholder="artboard"></div>
    <label class="check" title="Keep nesting past the fabric length until every part fits: upward, or downward when nesting from the top"><input id="extend" type="checkbox"><span>Auto-extend length</span></label>
    <label class="check" title="After Apply, resize the artboard to the fabric width and the nested length"><input id="resize" type="checkbox"><span>Fit artboard to nest</span></label>
    <div class="row"><label for="spacing" title="Minimum gap between two parts">Part spacing (mm)</label><input id="spacing" type="number" min="0" step="0.5" value="5"></div>
    <div class="row"><label for="margin" title="Empty space kept along the fabric edges">Border gap (mm)</label><input id="margin" type="number" min="0" step="0.5" value="10"></div>
    <div class="row"><label for="corner">Nest from</label>
      <select id="corner">
        <option value="bottom_left" selected>Bottom left</option>
        <option value="bottom_right">Bottom right</option>
        <option value="top_left">Top left</option>
        <option value="top_right">Top right</option>
      </select></div>
    <div class="row"><label for="rotation">Rotation</label>
      <select id="rotation">
        <option value="0_180" selected>0 / 180 (fabric grain)</option>
        <option value="fixed">No rotation</option>
        <option value="0_90_180_270">0 / 90 / 180 / 270</option>
        <option value="step">Every N degrees</option>
      </select></div>
    <div class="row" id="tolRow"><label for="tolerance">Grain tolerance (&plusmn;&deg;)</label><input id="tolerance" type="number" min="0" max="45" step="1" value="0"></div>
    <div class="row" id="stepRow"><label for="step">Rotation step (&deg;)</label><input id="step" type="number" min="1" max="180" step="1" value="5"></div>
    <div class="row"><label for="quality" title="Best tries more layouts and takes longer">Optimization</label>
      <select id="quality">
        <option value="fast">Fast</option>
        <option value="balanced">Balanced</option>
        <option value="high_quality">Best</option>
      </select></div>
    <div class="row"><label for="time" title="Nesting stops at this time and keeps the best layout found">Max nesting time (s)</label><input id="time" type="number" min="5" step="5" value="60"></div>
  </div>
</section>

<section id="pageLabels" class="page">
  <div class="settings">
    <div class="row"><label for="labelH" title="Scale every label to this height before placing it. Empty: keep the size">Label height (mm)</label><input id="labelH" type="number" min="0.1" step="0.5" value="1"></div>
    <div class="row"><label for="labelGap" title="Space between the label and the cut line">Label gap (mm)</label><input id="labelGap" type="number" min="0" step="0.5" value="0.5"></div>
    <div class="row"><label for="labelCorner" title="The label goes on the straight edge nearest to this corner of the piece">Label position</label>
      <select id="labelCorner">
        <option value="bottom_left" selected>Bottom left</option>
        <option value="bottom_right">Bottom right</option>
        <option value="top_left">Top left</option>
        <option value="top_right">Top right</option>
      </select></div>
  </div>
</section>

<section id="pageGroup" class="page" hidden>
  <div class="settings">
    <div class="row"><label for="groupSpacing" title="Gap between neighbouring pieces. A label or part belongs to a piece when it lies inside its cut line or within half this gap of it">Piece spacing (mm)</label><input id="groupSpacing" type="number" min="0.5" step="0.5" value="5"></div>
  </div>
</section>

<section id="pageResult" class="page" hidden>
  <div id="previewBox" class="preview">
    <img id="preview" alt="Nesting preview">
    <button id="zoom" class="zoom" title="Show the preview at full width">Zoom</button>
  </div>
  <details id="unplacedBox" hidden><summary id="unplacedTitle">Not placed</summary><ul id="unplaced"></ul></details>
</section>
<div id="notice" class="notice" role="alert" hidden>
  <p id="status" class="status"></p>
  <button id="noticeClose" class="close" title="Close" aria-label="Close">&times;</button>
</div>
</main>

<footer>
  <div class="actions" id="nestActions" hidden>
    <button id="nest">Nest selected</button>
    <button id="apply" class="primary" disabled>Apply to document</button>
  </div>
  <div class="actions" id="labelActions">
    <button id="placeLabels" class="primary">Place labels</button>
  </div>
  <div class="actions" id="groupActions" hidden>
    <button id="groupLabels" class="primary" title="One group per piece: its label, cut line, notches and image, ready to nest">Group pieces</button>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
